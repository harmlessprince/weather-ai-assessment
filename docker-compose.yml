services:
  backend:
    build:
      context: .
    image: weather-ai-assessment-backend:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      WEATHER_AI_API_KEY: ${WEATHER_AI_API_KEY}
      WEATHER_AI_BASE_URL: ${WEATHER_AI_BASE_URL:-https://api.weather-ai.co}
      DATABASE_PATH: /app/data/weather-ai.production.sqlite
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-360}
      ALERT_COOLDOWN_HOURS: ${ALERT_COOLDOWN_HOURS:-12}
      MAX_DEMO_SUBSCRIPTIONS: ${MAX_DEMO_SUBSCRIPTIONS:-3}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - weather_ai_data:/app/data

volumes:
  weather_ai_data:
